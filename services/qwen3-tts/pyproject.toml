[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kana-qwen3-tts"
version = "0.1.0"
description = "Local, versioned Qwen3-TTS service for Kana"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.137.1",
  "qwen-tts==0.1.1",
  "soundfile==0.14.0",
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "uvicorn[standard]==0.46.0",
]

[project.scripts]
kana-qwen3-tts = "kana_qwen3_tts.server:run"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["kana_qwen3_tts"]
